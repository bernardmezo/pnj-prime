; .user.ini — PHP per-directory config (dibaca PHP-FPM/CGI, bukan CLI)
; Naikkan batas upload agar sesuai dengan batas aplikasi (video maks 50 MB)
; File ini aman di-commit karena tidak menyimpan secret.

; Batas upload per file
upload_max_filesize = 55M

; Batas total POST body (harus >= upload_max_filesize + overhead form lain)
post_max_size = 60M

; Waktu eksekusi diperpanjang untuk upload file besar di koneksi lambat
max_execution_time = 120

; Waktu tunggu input dari browser
max_input_time = 120
